[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "delve-backend"
version = "0.1.0"
description = "Backend for the Delve app: a client of the Hermes Agent API server with durable runs, approvals and cards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "httpx>=0.28",
  "cryptography>=43",  # RS256 for the FCM service account (push.py)
  "websockets>=14",  # uvicorn's WebSocket implementation
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[project.scripts]
delve-backend = "delve.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/delve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "pg: needs a PostgreSQL database (DELVE_TEST_DATABASE_URL); skipped otherwise",
]
filterwarnings = [
  "error::DeprecationWarning:delve.*",
  # starlette 1.x's TestClient nudges towards httpx2 (a UserWarning subclass)
  "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
